name: test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: node bot.js 2>&1 | tee out.log
        env:
          ONCE: "1"
          SESSION_HOURS: "0.05"
          MC_HOST: ${{ vars.MC_HOST || 'lunahack.aternos.me' }}
          MC_USERNAME: ${{ vars.MC_USERNAME || 'ceyobot' }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          MC_VERSION: ${{ vars.MC_VERSION || '1.21.4' }}
      - name: Publish log as annotation
        if: ${{ always() }}
        run: python3 notice.py
